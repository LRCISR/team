<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>LRC · מעקב מוזמנים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--night:#16151E;--gold:#C9AD78;--gold-soft:#E6D6B3;--paper:#F5F1EA;--card:#fff;--ink:#262433;--muted:#6A6577;--line:#E3DCCF;--ok:#2F7A46;--okbg:#E3F1E6;--wait:#FFF5DB;--err:#A8321F;--serif:'Frank Ruhl Libre',Georgia,serif;--sans:'Rubik',Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:max(24px,env(safe-area-inset-bottom))}
.col{max-width:560px;margin:0 auto;padding:0 16px}
header{background:var(--night);color:#F3EEE6;padding:22px 0 26px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{display:inline-flex;align-items:center;gap:7px;direction:ltr}.logo svg{width:20px;height:23px}.logo b{font-weight:600;font-size:19px;color:#fff}
.ev{font-size:13px;color:var(--gold)}
h1{font-family:var(--serif);font-weight:400;font-size:28px;margin:14px 0 16px;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:rgba(255,255,255,.06);border:1px solid rgba(201,173,120,.35);border-radius:10px;padding:10px 6px;text-align:center}
.st b{display:block;font-size:26px;font-weight:600;color:#fff;line-height:1.1}.st span{font-size:12.5px;color:#CFC8D8}
.st.g b{color:var(--gold-soft)}
.bar{height:6px;background:rgba(255,255,255,.12);border-radius:3px;margin-top:14px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
.tot{font-size:12.5px;color:#BDB6C8;margin-top:8px}
.add{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:-14px;position:relative;box-shadow:0 4px 18px rgba(22,21,30,.08)}
.add input{width:100%;font:inherit;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:9px;background:#FCFAF6;color:var(--ink)}
.add input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.who{display:flex;gap:6px;margin-top:10px}
.who button,.flt button{flex:1;font:inherit;font-size:15px;padding:9px 0;border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--ink)}
.who button[aria-pressed=true],.flt button[aria-pressed=true]{background:var(--night);color:#fff;border-color:var(--night)}
.go{width:100%;margin-top:10px;font:inherit;font-size:17px;font-weight:600;padding:13px;border:0;border-radius:9px;background:var(--gold);color:var(--night)}
.go:disabled{opacity:.6}
.flt{display:flex;gap:6px;margin:18px 0 10px}.flt button{font-size:13.5px;padding:7px 0}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:7px}
li.ok{background:var(--okbg);border-color:#C6E2CC}li.no{background:var(--wait);border-color:#F0E2B6}
li .nm{flex:1;font-size:16.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .by{font-size:12px;color:var(--muted);background:rgba(0,0,0,.05);padding:2px 8px;border-radius:999px}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);border:0;background:none;font-family:inherit;padding:4px}
.chk i{width:26px;height:26px;border:2px solid #B9B2A4;border-radius:7px;display:grid;place-items:center;font-style:normal;color:#fff;font-size:17px;background:#fff}
li.ok .chk i{background:var(--ok);border-color:var(--ok)}
li.ok .chk{color:var(--ok);font-weight:500}
.del{border:0;background:none;color:#B3AC9F;font-size:20px;padding:0 2px;line-height:1}
.del.sure{color:var(--err);font-size:13px;font-family:inherit}
.empty{text-align:center;color:var(--muted);padding:26px 0}
.msg{font-size:14px;color:var(--err);margin-top:8px;text-align:center}
.pin{min-height:100vh;display:grid;place-items:center;background:var(--night)}
.pin .bx{text-align:center;color:#fff;width:min(320px,90vw)}
.pin input{width:100%;font:inherit;font-size:28px;letter-spacing:10px;text-align:center;padding:12px;border-radius:10px;border:1px solid var(--gold);background:rgba(255,255,255,.06);color:#fff;margin:18px 0 10px}
.pin p{color:#CFC8D8;margin:6px 0 0}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="lf" viewBox="170 60 240 275"><path fill="#fff" d="M300,70 C 300,150 330,220 395,265 C 405,190 380,110 300,70 Z"/><path fill="#C9AD78" d="M175,240 C 260,215 340,245 380,305 C 300,335 220,310 175,240 Z"/></symbol></svg>

<section class="pin" id="pinView">
  <form class="bx" id="pinForm">
    <div class="logo"><svg style="width:28px;height:32px"><use href="#lf"/></svg><b style="font-size:26px">LRC</b></div>
    <p>מעקב מוזמנים · ערב VIP</p>
    <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" aria-label="קוד כניסה" placeholder="••••">
    <button class="go" type="submit">כניסה</button>
    <div class="msg" id="pinMsg" hidden>קוד שגוי</div>
  </form>
</section>

<div id="app" hidden>
  <header><div class="col">
    <div class="top"><div class="logo"><svg><use href="#lf"/></svg><b>LRC</b></div><span class="ev">ערב VIP · יקב בנימינה · 17.12</span></div>
    <h1>איפה אנחנו עומדים</h1>
    <div class="stats">
      <div class="st"><b id="sSent">0</b><span>הוזמנו</span></div>
      <div class="st g"><b id="sOk">0</b><span>נרשמו</span></div>
      <div class="st"><b id="sPct">0%</b><span>הרשמה</span></div>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="tot" id="tot"></div>
  </div></header>

  <main class="col">
    <form class="add" id="addForm">
      <input id="name" placeholder="שם הלקוח שהוזמן" autocomplete="off" enterkeyhint="done">
      <div class="who" id="who"><button type="button" data-v="רועי">רועי</button><button type="button" data-v="יואב">יואב</button><button type="button" data-v="רום">רום</button></div>
      <button class="go" id="addBtn" type="submit">+ הוספה</button>
      <div class="msg" id="addErr" hidden>לא נשמר, נסו שוב בעוד רגע</div>
    </form>
    <div class="flt" id="flt">
      <button type="button" data-f="all" aria-pressed="true">כולם</button>
      <button type="button" data-f="no" aria-pressed="false">עוד לא נרשמו</button>
      <button type="button" data-f="mine" aria-pressed="false">רק שלי</button>
    </div>
    <ul id="list"></ul>
    <div class="empty" id="empty" hidden>עוד אין מוזמנים. מוסיפים למעלה 👆</div>
    <div class="msg" id="err" hidden>לא הצלחנו להתחבר. נסו לרענן.</div>
  </main>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbztbhk3SdXdAMg2FH3XzDy31uJCX5M5ZHO1Q1BmmPXXaE3uNX2lu3usv7Ir0-8Dc8p6ag/exec';
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let PIN=store.get('lrc_pin')||'', ME=store.get('lrc_me')||'', F='all', LIST=[];
function call(d){d.pin=PIN;const ac=new AbortController();setTimeout(()=>ac.abort(),30000);return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(d),redirect:'follow',signal:ac.signal}).then(r=>r.json())}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function apply(r){
  if(r.status==='pin'){PIN='';store.set('lrc_pin','');$('app').hidden=true;$('pinView').hidden=false;return false}
  if(r.status==='stale'){load();return true}
  if(r.status!=='ok'){$('err').hidden=false;return false}
  $('err').hidden=true;LIST=r.list;render();
  $('tot').textContent='סה״כ רשומים לאירוע (כולל חברים): '+r.total+' מתוך '+r.capacity;
  return true;
}
function render(){
  const ok=LIST.filter(x=>x.ok).length, n=LIST.length, p=n?Math.round(ok/n*100):0;
  $('sSent').textContent=n;$('sOk').textContent=ok;$('sPct').textContent=p+'%';$('bar').style.width=p+'%';
  let v=LIST.slice().reverse();
  if(F==='no')v=v.filter(x=>!x.ok);
  if(F==='mine')v=v.filter(x=>x.by===ME);
  v.sort((a,b)=>a.ok-b.ok);
  $('list').innerHTML=v.map(x=>`<li class="${x.ok?'ok':'no'}" data-row="${x.row}"><span class="nm">${esc(x.name)}</span>${x.by?`<span class="by">${esc(x.by)}</span>`:''}<button class="chk" type="button" aria-pressed="${x.ok}"><i>${x.ok?'✓':''}</i>${x.ok?'נרשם':'נרשם?'}</button><button class="del" type="button" aria-label="מחיקה">×</button></li>`).join('');
  $('empty').hidden=v.length>0;
}
function load(){return call({type:'inv_list'}).then(apply).catch(()=>{$('err').hidden=false})}
function setWho(v){ME=v;store.set('lrc_me',v);document.querySelectorAll('#who button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v))}
$('pinForm').onsubmit=e=>{e.preventDefault();PIN=$('pin').value.trim();call({type:'inv_list'}).then(r=>{if(r.status==='ok'){store.set('lrc_pin',PIN);$('pinView').hidden=true;$('app').hidden=false;apply(r)}else{$('pinMsg').hidden=false}}).catch(()=>{$('pinMsg').textContent='בעיית חיבור, נסו שוב';$('pinMsg').hidden=false})};
$('who').onclick=e=>{const b=e.target.closest('button');if(b)setWho(b.dataset.v)};
$('flt').onclick=e=>{const b=e.target.closest('button');if(!b)return;F=b.dataset.f;document.querySelectorAll('#flt button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()};
$('addForm').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim();if(name.length<2){$('name').focus();return}
  const btn=$('addBtn');btn.disabled=true;btn.textContent='שומר…';
  LIST.push({row:0,name,by:ME,ok:false});render();$('name').value='';
  const fail=()=>{LIST=LIST.filter(x=>!(x.row===0&&x.name===name));render();$('name').value=name;$('addErr').hidden=false};
  $('addErr').hidden=true;
  call({type:'inv_add',name,by:ME}).then(r=>{if(r.status==='ok')apply(r);else if(r.status==='pin')apply(r);else fail()}).catch(fail).finally(()=>{btn.disabled=false;btn.textContent='+ הוספה'})};
$('list').onclick=e=>{const li=e.target.closest('li');if(!li)return;const row=+li.dataset.row;const x=LIST.find(y=>y.row===row);if(!x||!row)return;
  if(e.target.closest('.chk')){x.ok=!x.ok;render();call({type:'inv_set',row,name:x.name,value:x.ok}).then(apply)}
  const d=e.target.closest('.del');
  if(d){if(!d.classList.contains('sure')){d.classList.add('sure');d.textContent='למחוק?';setTimeout(()=>{if(d.isConnected){d.classList.remove('sure');d.textContent='×'}},3000);return}
    LIST=LIST.filter(y=>y!==x);render();call({type:'inv_del',row,name:x.name}).then(apply)}};
if(ME)setWho(ME);
if(PIN){$('pinView').hidden=true;$('app').hidden=false;load()}
setInterval(()=>{if(PIN&&!document.hidden)load()},60000);
</script>
</body>
</html>
